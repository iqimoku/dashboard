name: Fetch Tweets SteveDJacobs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-tweets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install feedparser requests --break-system-packages

      - name: Fetch tweets via RSS
        run: python3 fetch_tweets_rss.py

      - name: Commit i push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tweets.json
          git diff --staged --quiet || git commit -m "update tweets $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

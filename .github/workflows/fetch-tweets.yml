name: Fetch Tweets SteveDJacobs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-tweets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch tweets
        env:
          BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: |
          if [ -z "$BEARER_TOKEN" ]; then
            echo "BLAD: Secret TWITTER_BEARER_TOKEN jest pusty!"
            exit 1
          fi
          echo "Token OK: ${BEARER_TOKEN:0:15}..."

          USER_RESPONSE=$(curl -s \
            -H "Authorization: Bearer $BEARER_TOKEN" \
            "https://api.twitter.com/2/users/by/username/SteveDJacobs")
          echo "User response: $USER_RESPONSE"

          USER_ID=$(echo "$USER_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['id'])")
          echo "User ID: $USER_ID"

          curl -s \
            -H "Authorization: Bearer $BEARER_TOKEN" \
            "https://api.twitter.com/2/users/${USER_ID}/tweets?max_results=20&tweet.fields=created_at,public_metrics,entities&expansions=author_id&user.fields=name,username,profile_image_url" \
            > tweets_raw.json

          echo "Tweets: $(head -c 300 tweets_raw.json)"

          python3 process_tweets.py

      - name: Commit i push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tweets.json
          git diff --staged --quiet || git commit -m "update tweets $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

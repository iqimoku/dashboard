name: Fetch Tweets SteveDJacobs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-tweets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch tweets
        env:
          BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: |
          if [ -z "$BEARER_TOKEN" ]; then
            echo "BLAD: Secret jest pusty!"
            exit 1
          fi
          echo "Token OK"

          curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $BEARER_TOKEN" \
            "https://api.twitter.com/2/users/by/username/SteveDJacobs" \
            > user_response.txt

          echo "===== PELNA ODPOWIEDZ API ====="
          cat user_response.txt
          echo ""
          echo "================================"

          USER_ID=$(python3 -c "
import json
with open('user_response.txt') as f:
    content = f.read()
body = content.split('HTTP_STATUS:')[0]
data = json.loads(body)
print(data['data']['id'])
")
          echo "User ID: $USER_ID"

          curl -s \
            -H "Authorization: Bearer $BEARER_TOKEN" \
            "https://api.twitter.com/2/users/${USER_ID}/tweets?max_results=20&tweet.fields=created_at,public_metrics,entities&expansions=author_id&user.fields=name,username,profile_image_url" \
            > tweets_raw.json

          python3 process_tweets.py

      - name: Commit i push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tweets.json
          git diff --staged --quiet || git commit -m "update tweets $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
